<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenAgentFleet</title>
    <meta name="description" content="The OpenAgentFleet console: your agents' desktops live, the fleet chat, the org chart and the Work board, with desktops, Claude Code, Codex, Hermes and OpenClaw side by side." />
    <meta name="theme-color" content="#0b0f17" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <script>
      // Applied before first paint. Reading the theme in React instead would
      // render one frame of the default theme first, which is the white flash
      // every dark-mode app is judged on.
      (function () {
        try {
          var mode = localStorage.getItem("agentfleet.mode") || "system";
          var accent = localStorage.getItem("agentfleet.accent") || "amber";
          if (mode === "system") {
            mode = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          }
          document.documentElement.dataset.mode = mode;
          document.documentElement.dataset.accent = accent;
        } catch (e) {
          document.documentElement.dataset.mode = "dark";
          document.documentElement.dataset.accent = "amber";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
