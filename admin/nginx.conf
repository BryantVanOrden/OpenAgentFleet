server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Single-page app: unknown paths are routes, not 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Everything dynamic goes to the orchestrator. The desktop proxy and the
    # event socket both need upgrade headers and no buffering — without
    # proxy_buffering off, a live agent looks frozen.
    #
    # The upstream is a VARIABLE with an explicit resolver, not a literal.
    # nginx resolves a literal proxy_pass hostname exactly once, at startup —
    # so recreating the api container (a new deploy, a compose up --build)
    # gave it a new address on the compose network and every console request
    # answered 502 until the admin container was also restarted. A variable
    # forces per-request resolution against Docker's embedded DNS, whose
    # answers follow the container. 127.0.0.11 is that DNS, fixed by Docker.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $orchestrator http://api:8080;
    location ~ ^/(api|vnc|healthz) {
        proxy_pass $orchestrator;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ~* \.(js|css|woff2|png|svg)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
