name: agentfleet_companion
description: Watch, talk to, and take over your autonomous OS agents.
publish_to: "none"
version: 1.1.0+2

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State. Riverpod over Bloc here because most of this app is "watch a stream
  # and rebuild"; the ceremony of a bloc per screen would not earn its keep.
  flutter_riverpod: ^2.6.1

  # Networking.
  dio: ^5.7.0
  web_socket_channel: ^3.0.1

  # The desktop stream. noVNC is served by the orchestrator's authenticated
  # proxy, so an embedded web view gets a working remote desktop — including
  # touch-to-mouse — without shipping an RFB client.
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.3.2
  webview_flutter_wkwebview: ^3.17.0

  # The desktop viewer on Linux and Windows, embedded in the page rather than
  # in a window of its own. webview_flutter has no implementation there, so
  # this carries CEF; it is the only option that renders into the widget tree
  # on Linux, which is what makes the desktop tab behave the same everywhere.
  webview_cef: ^0.6.2

  # Last-resort fallback, and for any other outbound link.
  url_launcher: ^6.3.1

  # Voice. On-device rather than server-side: Android and iOS both ship good
  # recognisers and synthesisers, the backend has no STT/TTS provider, and the
  # sandbox's "TTS" is a sine-wave generator, not speech. Keeping it on-device
  # also means audio never leaves the handset.
  speech_to_text: ^7.0.0
  # On-device synthesis, still the fallback when the server has no TTS service.
  flutter_tts: ^4.2.0
  # Playback for server-rendered speech.
  just_audio: ^0.9.42

  # Push. Firebase covers Android and iOS; the backend also speaks APNs directly
  # for builds that skip Firebase entirely.
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.6
  flutter_local_notifications: ^18.0.1

  shared_preferences: ^2.3.3

  # Parses chat markdown into an AST the app renders itself; the Flutter
  # team's own widget package for this was discontinued, and the parser is
  # the part worth outsourcing anyway.
  markdown: ^7.2.2
  intl: ^0.19.0
  cupertino_icons: ^1.0.8
  image_picker: ^1.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Branding generators. Both are build-time only: they rasterise the masters in
  # assets/branding/ into each platform's icon and splash directories, and the
  # generated files are committed so a plain `flutter build` needs neither.
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/branding/

# Launcher icons. Regenerate with:
#   dart run flutter_launcher_icons
# Linux has no launcher-icon concept in this package; its icon ships as a
# .desktop entry instead (see linux/agentfleet.desktop).
flutter_launcher_icons:
  image_path: assets/branding/icon.png
  android: true
  ios: true
  remove_alpha_ios: true
  # Android 8+ masks the foreground into whatever shape the launcher uses, so
  # the monogram sits inside the 66% safe zone and the amber is a flat colour
  # rather than part of the image.
  adaptive_icon_background: "#F5A524"
  adaptive_icon_foreground: assets/branding/icon_foreground.png
  macos:
    generate: true
    image_path: assets/branding/icon.png
  windows:
    generate: true
    image_path: assets/branding/icon.png

# Native splash. Regenerate with:
#   dart run flutter_native_splash:create
flutter_native_splash:
  color: "#0D0F14"
  image: assets/branding/splash.png
  # Android 12 replaced the old splash with a system-drawn icon window; it
  # needs its own asset or the mark gets cropped by the circular mask.
  android_12:
    color: "#0D0F14"
    image: assets/branding/splash.png
    icon_background_color: "#0D0F14"
  android: true
  ios: true
  web: false
