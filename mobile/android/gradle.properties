# Modest heap on purpose: the Flutter default (-Xmx8G) crashes the Gradle daemon
# on developer laptops that are also running an emulator/IDE. Raise it locally if
# you have the headroom.
org.gradle.jvmargs=-Xmx1500m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=false
org.gradle.workers.max=2
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
