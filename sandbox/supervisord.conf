; Service graph inside a sandbox. Ordering matters, and so does the session bus.
;
; The accessibility tree is what makes a recording survive a UI change, and it
; only exists if XFCE, at-spi and agentd all share ONE session D-Bus. That is why
; the bus is started explicitly at a fixed address and handed to every program
; below, rather than left to dbus-launch — three processes each spawning their
; own bus is the failure mode where everything "works" but the tree is empty.
[supervisord]
nodaemon=true
logfile=/var/log/agentfleet/supervisord.log
pidfile=/var/run/agentfleet/supervisord.pid
user=root
environment=DBUS_SESSION_BUS_ADDRESS="unix:path=/var/run/agentfleet/session_bus"

[program:xvfb]
command=/usr/bin/Xvfb %(ENV_DISPLAY)s -screen 0 %(ENV_SCREEN_RESOLUTION)s -ac -noreset
    +extension GLX +extension RANDR +extension RENDER +extension RECORD
priority=10
autorestart=true
stdout_logfile=/var/log/agentfleet/xvfb.log
stderr_logfile=/var/log/agentfleet/xvfb.err

[program:dbus-system]
command=/usr/bin/dbus-daemon --system --nofork --nopidfile
priority=15
autorestart=true
stdout_logfile=/var/log/agentfleet/dbus-system.log
stderr_logfile=/var/log/agentfleet/dbus-system.err

; Fixed-address session bus, owned by the agent user so everything that matters
; can reach it.
; The environment matters here more than anywhere: services the bus starts on
; demand (xfconfd first among them) inherit the DAEMON's environment, not the
; desktop's. With no HOME the xfconf backend died with 'Unable to create
; configuration directory "(null)"' and the session fell back to its failsafe
; dialog -- reliably on the heavier -dev image, where the desktop's own
; dbus-update-activation-environment ran before the bus was listening and
; pushed nothing.
[program:dbus-session]
command=/usr/bin/dbus-daemon --session --nofork --nopidfile
    --address=unix:path=/var/run/agentfleet/session_bus
priority=16
user=agent
environment=HOME="/home/agent",USER="agent",LOGNAME="agent",DISPLAY="%(ENV_DISPLAY)s",XDG_RUNTIME_DIR="/var/run/agentfleet",XDG_CONFIG_HOME="/home/agent/.config",XDG_CACHE_HOME="/home/agent/.cache",XDG_DATA_HOME="/home/agent/.local/share",XDG_CONFIG_DIRS="/etc/xdg",XDG_DATA_DIRS="/usr/local/share:/usr/share"
autorestart=true
startsecs=2
stdout_logfile=/var/log/agentfleet/dbus-session.log
stderr_logfile=/var/log/agentfleet/dbus-session.err

; The AT-SPI bus is what turns "click at 412,108" into "click the button
; labelled Build". Without it the agent is reduced to raw pixels.
[program:atspi]
command=/bin/bash -lc '/usr/local/bin/wait-for-session.sh; exec $(command -v at-spi-bus-launcher || echo /usr/libexec/at-spi-bus-launcher) --launch-immediately'
priority=20
user=agent
environment=DISPLAY="%(ENV_DISPLAY)s",HOME="/home/agent",DBUS_SESSION_BUS_ADDRESS="unix:path=/var/run/agentfleet/session_bus",NO_AT_BRIDGE="0"
autorestart=true
startsecs=3
stdout_logfile=/var/log/agentfleet/atspi.log
stderr_logfile=/var/log/agentfleet/atspi.err

; Wait for the session bus socket before starting. supervisord's priority only
; orders the spawn calls -- it is not readiness -- and xfce4-session connects to
; the bus once, at startup. Spawned 200ms after dbus-daemon it sometimes won
; that race and, finding no bus, parked on the "Unable to load a failsafe
; session" dialog forever: xfconfd never started, no panel, no window manager,
; and supervisord saw a healthy long-running process. Seen on the -dev image,
; where a heavier container tips the timing, but the race is in every image.
;
; The activation-environment push is the second half: xfconfd is started BY the
; bus on demand, so it inherits the bus daemon's environment, which has no HOME.
; Without this it dies with 'Unable to create configuration directory "(null)"'.
[program:xfce]
command=/bin/bash -c '/usr/local/bin/wait-for-session.sh; dbus-update-activation-environment --all >/dev/null 2>&1; exec /usr/bin/startxfce4'
priority=30
user=agent
environment=DISPLAY="%(ENV_DISPLAY)s",HOME="/home/agent",DBUS_SESSION_BUS_ADDRESS="unix:path=/var/run/agentfleet/session_bus",GTK_MODULES="gail:atk-bridge",QT_ACCESSIBILITY="1",QT_LINUX_ACCESSIBILITY_ALWAYS_ON="1",GNOME_ACCESSIBILITY="1",NO_AT_BRIDGE="0",XDG_RUNTIME_DIR="/var/run/agentfleet"
autorestart=true
startsecs=5
stdout_logfile=/var/log/agentfleet/xfce.log
stderr_logfile=/var/log/agentfleet/xfce.err

[program:x11vnc]
command=/usr/bin/x11vnc -display %(ENV_DISPLAY)s -forever -shared -nopw -rfbport 5901 -xkb -noxrecord -noxfixes -noxdamage -wait 10
priority=40
autorestart=true
startretries=20
stdout_logfile=/var/log/agentfleet/x11vnc.log
stderr_logfile=/var/log/agentfleet/x11vnc.err

; noVNC is served without its own password: the orchestrator's authenticated
; proxy is the access control, and the port is never published to the host.
[program:novnc]
command=/usr/bin/websockify --web=/usr/share/novnc %(ENV_VNC_PORT)s localhost:5901
priority=50
autorestart=true
stdout_logfile=/var/log/agentfleet/novnc.log
stderr_logfile=/var/log/agentfleet/novnc.err

; A SECOND, view-only VNC server on its own port. The orchestrator routes
; auditors here and operators to 5901.
;
; This has to be enforced server-side: noVNC's `view_only` URL parameter is a
; client-side courtesy that anyone can delete from the address bar. Two servers
; is the only version of "auditors may watch but not touch" that is actually
; true, and the platform documents that claim.
[program:x11vnc-view]
command=/usr/bin/x11vnc -display %(ENV_DISPLAY)s -forever -shared -nopw -viewonly -rfbport 5902 -xkb -noxrecord -noxfixes -noxdamage -wait 10
priority=41
autorestart=true
startretries=20
stdout_logfile=/var/log/agentfleet/x11vnc-view.log
stderr_logfile=/var/log/agentfleet/x11vnc-view.err

[program:novnc-view]
command=/usr/bin/websockify --web=/usr/share/novnc %(ENV_VNC_VIEW_PORT)s localhost:5902
priority=51
autorestart=true
stdout_logfile=/var/log/agentfleet/novnc-view.log
stderr_logfile=/var/log/agentfleet/novnc-view.err

[program:agentd]
command=/opt/agentd/venv/bin/python -m uvicorn main:app --host 0.0.0.0 --port %(ENV_AGENTD_PORT)s --log-level warning
directory=/opt/agentd
priority=60
user=agent
environment=DISPLAY="%(ENV_DISPLAY)s",HOME="/home/agent",PYTHONUNBUFFERED="1",DBUS_SESSION_BUS_ADDRESS="unix:path=/var/run/agentfleet/session_bus",GTK_MODULES="gail:atk-bridge",NO_AT_BRIDGE="0",ALLOW_SHELL="%(ENV_ALLOW_SHELL)s",AGENTFLEET_INSTANCE="%(ENV_AGENTFLEET_INSTANCE)s",XDG_RUNTIME_DIR="/var/run/agentfleet"
autorestart=true
startretries=20
stdout_logfile=/var/log/agentfleet/agentd.log
stderr_logfile=/var/log/agentfleet/agentd.err
