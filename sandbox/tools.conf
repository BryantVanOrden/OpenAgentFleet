# How to install each archetype tool that is not a plain apt package.
#
# Format:  tool = method:spec
#
#   apt:PKG    apt package under a different name (the default is the tool name)
#   pip:PKG    pip package
#   npm:PKG    npm global package
#   go:MODULE  go install (needs golang, which is pulled in on demand)
#   url:URL    download a single binary to /usr/local/bin/<tool> and chmod +x
#   tgz:URL#PATH  download a tarball and extract PATH out of it as the binary
#   sh:SNIPPET run a shell snippet; must leave the tool on PATH
#   skip       there is no unattended install (licensed, interactive, or huge)
#
# Anything not listed here is attempted as an apt package of the same name.
# Anything that fails is simply not claimed to the agent, so a missing entry
# degrades to honesty rather than to a broken bot.

# --- kubernetes / infra ------------------------------------------------------
kubectl      = sh:curl -fsSL "https://dl.k8s.io/release/$(curl -fsSL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl" -o /usr/local/bin/kubectl && chmod +x /usr/local/bin/kubectl
helm         = sh:curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
k9s          = tgz:https://github.com/derailed/k9s/releases/latest/download/k9s_Linux_amd64.tar.gz#k9s
stern        = tgz:https://github.com/stern/stern/releases/download/v1.31.0/stern_1.31.0_linux_amd64.tar.gz#stern
terraform    = sh:curl -fsSL https://apt.releases.hashicorp.com/gpg | gpg --dearmor -o /usr/share/keyrings/hashicorp.gpg && echo "deb [signed-by=/usr/share/keyrings/hashicorp.gpg] https://apt.releases.hashicorp.com $(. /etc/os-release && echo $VERSION_CODENAME) main" > /etc/apt/sources.list.d/hashicorp.list && apt-get update -qq && apt-get install -y terraform
trivy        = sh:curl -fsSL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
docker       = apt:docker.io
promql-cli   = skip
grafana-cli  = skip

# --- security ----------------------------------------------------------------
semgrep      = pip:semgrep
nuclei       = go:github.com/projectdiscovery/nuclei/v3/cmd/nuclei@latest
subfinder    = go:github.com/projectdiscovery/subfinder/v2/cmd/subfinder@latest
volatility3  = pip:volatility3
ghidra       = skip
metasploit   = skip
burpsuite    = skip

# --- languages and package managers ------------------------------------------
go           = apt:golang-go
rustc        = apt:rustc
cargo        = apt:cargo
node         = apt:nodejs
bun          = sh:curl -fsSL https://bun.sh/install | bash -s -- && install -m755 /root/.bun/bin/bun /usr/local/bin/bun
pnpm         = npm:pnpm
yq           = apt:yq
lazygit      = tgz:https://github.com/jesseduffield/lazygit/releases/download/v0.44.1/lazygit_0.44.1_Linux_x86_64.tar.gz#lazygit

