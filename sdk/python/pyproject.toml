[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentfleet"
version = "0.1.0"
description = "Official Python SDK and CLI for AgentFleet — Hard-Sandboxed Autonomous Multi-Agent Platform"
readme = "README.md"
authors = [
    { name = "Bryant VanOrden", email = "supermanismebvo123@gmail.com" }
]
# Matches the repository's LICENSE. This said Apache-2.0, so the one artifact
# that gets published to a package index would have claimed a more permissive
# grant than the code it wraps actually carries.
license = { text = "PolyForm-Noncommercial-1.0.0" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.10"
dependencies = [
    "urllib3>=2.0.0",
]

[project.scripts]
fleetctl = "agentfleet.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agentfleet*"]
