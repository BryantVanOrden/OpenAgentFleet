[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentfleet"
version = "1.0.0"
description = "Official Python SDK and fleetctl CLI for AgentFleet — self-hosted autonomous computer-use agents, each with its own Linux desktop"
readme = "README.md"
authors = [
    { name = "Bryant VanOrden", email = "supermanismebvo123@gmail.com" }
]
# Matches the repository's LICENSE — the one invariant here, whatever the
# license is. This field once said Apache-2.0 over a noncommercial repo, which
# would have published a permission the code did not grant.
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.10"
dependencies = [
    "urllib3>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/BryantVanOrden/AgentFleet"
Repository = "https://github.com/BryantVanOrden/AgentFleet"
Documentation = "https://github.com/BryantVanOrden/AgentFleet/tree/main/docs"
Changelog = "https://github.com/BryantVanOrden/AgentFleet/blob/main/CHANGELOG.md"
Issues = "https://github.com/BryantVanOrden/AgentFleet/issues"

[project.scripts]
fleetctl = "agentfleet.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agentfleet*"]
