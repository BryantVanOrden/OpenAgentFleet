name: agentfleet

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agentfleet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentfleet}
      POSTGRES_DB: ${POSTGRES_DB:-agentfleet}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agentfleet}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [control]

  api:
    build:
      context: ./backend
    environment:
      AGENTFLEET_ENV: ${AGENTFLEET_ENV:-development}
      HTTP_ADDR: ":8080"
      # Where this server is reachable from a phone or another machine, not
      # from inside the container. OAuth redirects are sent here, and a
      # localhost redirect resolves to whichever device opened the sign-in
      # page rather than to the server.
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      DATABASE_URL: postgres://${POSTGRES_USER:-agentfleet}:${POSTGRES_PASSWORD:-agentfleet}@db:5432/${POSTGRES_DB:-agentfleet}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-}
      MASTER_KEY: ${MASTER_KEY:-}
      # The orchestrator provisions sandboxes by talking to the host engine.
      DOCKER_HOST: unix:///var/run/docker.sock
      SANDBOX_NETWORK: agentfleet_sandbox
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:-agentfleet/sandbox:latest}
      HOST_GATEWAY: host.docker.internal
      MAX_INSTANCES: ${MAX_INSTANCES:-8}
      ALLOW_SHELL: ${ALLOW_SHELL:-true}
      AGENT_MAX_STEPS: ${AGENT_MAX_STEPS:-60}
      AGENT_STALL_THRESHOLD: ${AGENT_STALL_THRESHOLD:-3}
      AGENT_SCREENSHOT_MAX_WIDTH: ${AGENT_SCREENSHOT_MAX_WIDTH:-1280}
      AGENT_COORD_SPACE: ${AGENT_COORD_SPACE:-auto}
      # /proc/stat and /proc/meminfo are not namespaced, so CPU and memory are
      # already the host's from in here. The filesystem is, hence the read-only
      # host mount below and this pointing at it.
      HOST_DISK_PATH: /hostfs
      # GPU stats arrive as a file written by the host, not by running
      # nvidia-smi in here: this image is Alpine, and the binary the NVIDIA
      # container runtime injects is glibc-linked, so it cannot execute.
      HOST_GPU_STATS_FILE: /hostfs/run/agentfleet/gpu-stats.csv
      TTS_BASE_URL: ${TTS_BASE_URL:-http://tts:8080}
      ARTIFACT_BACKEND: ${ARTIFACT_BACKEND:-fs}
      ARTIFACT_DIR: /var/lib/agentfleet/artifacts
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-agentfleet}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_VISION_MODEL: ${OLLAMA_VISION_MODEL:-qwen2.5vl:7b}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
      FCM_SERVICE_ACCOUNT: ${FCM_SERVICE_ACCOUNT:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - artifacts:/var/lib/agentfleet/artifacts
      - ${FCM_SERVICE_ACCOUNT_HOST:-./deploy/placeholder}:/etc/agentfleet/fcm.json:ro
      # Read-only, and only so host disk usage can be reported honestly rather
      # than showing the image's own layer. This container already holds the
      # docker socket, so it adds no privilege it did not have.
      - /:/hostfs:ro
    # The container user needs the host's docker group to reach the socket.
    # `make up` computes this; override GID in .env if your host differs.
    group_add:
      - ${DOCKER_GID:-999}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8080}:8080"
    networks: [control, sandbox]
    restart: unless-stopped

  # Text to speech. Optional: with the service absent the API reports voices as
  # unavailable and the app falls back to the phone's own synthesiser, so a
  # deployment that does not want a ~2 GB image can simply not run it.
  tts:
    build:
      context: ./tts
    environment:
      TTS_LANGUAGE: ${TTS_LANGUAGE:-english}
      # Leaves headroom on a machine that is also running inference; the model
      # is faster than realtime well before it needs every core.
      OMP_NUM_THREADS: ${TTS_THREADS:-4}
    volumes:
      # Model weights, downloaded once and kept across rebuilds.
      - tts-models:/models
    networks: [control]
    restart: unless-stopped

  admin:
    build:
      context: ./admin
    depends_on: [api]
    ports:
      - "${ADMIN_PORT:-8081}:80"
    networks: [control]
    restart: unless-stopped

  # Optional object storage. Screenshots and session recordings default to a
  # local volume; set ARTIFACT_BACKEND=s3 to use this instead.
  minio:
    image: minio/minio:latest
    profiles: ["s3"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    volumes:
      - minio-data:/data
    ports:
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    networks: [control]

volumes:
  db-data:
  tts-models:
  artifacts:
  minio-data:

networks:
  # Platform services. Sandboxes are never attached here.
  control:
    driver: bridge

  # Where sandboxes live. The orchestrator joins it so it can reach agentd and
  # proxy the desktop; nothing else on the control plane can.
  sandbox:
    name: agentfleet_sandbox
    driver: bridge
