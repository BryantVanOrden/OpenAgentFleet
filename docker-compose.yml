name: agentfleet

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agentfleet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentfleet}
      POSTGRES_DB: ${POSTGRES_DB:-agentfleet}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agentfleet}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [control]

  api:
    build:
      context: ./backend
    environment:
      AGENTFLEET_ENV: ${AGENTFLEET_ENV:-development}
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-agentfleet}:${POSTGRES_PASSWORD:-agentfleet}@db:5432/${POSTGRES_DB:-agentfleet}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-}
      MASTER_KEY: ${MASTER_KEY:-}
      # The orchestrator provisions sandboxes by talking to the host engine.
      DOCKER_HOST: unix:///var/run/docker.sock
      SANDBOX_NETWORK: agentfleet_sandbox
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:-agentfleet/sandbox:latest}
      HOST_GATEWAY: host.docker.internal
      MAX_INSTANCES: ${MAX_INSTANCES:-8}
      ALLOW_SHELL: ${ALLOW_SHELL:-true}
      AGENT_MAX_STEPS: ${AGENT_MAX_STEPS:-60}
      AGENT_STALL_THRESHOLD: ${AGENT_STALL_THRESHOLD:-3}
      AGENT_SCREENSHOT_MAX_WIDTH: ${AGENT_SCREENSHOT_MAX_WIDTH:-1280}
      AGENT_COORD_SPACE: ${AGENT_COORD_SPACE:-auto}
      ARTIFACT_BACKEND: ${ARTIFACT_BACKEND:-fs}
      ARTIFACT_DIR: /var/lib/agentfleet/artifacts
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-agentfleet}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_VISION_MODEL: ${OLLAMA_VISION_MODEL:-qwen2.5vl:7b}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
      FCM_SERVICE_ACCOUNT: ${FCM_SERVICE_ACCOUNT:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - artifacts:/var/lib/agentfleet/artifacts
      - ${FCM_SERVICE_ACCOUNT_HOST:-./deploy/placeholder}:/etc/agentfleet/fcm.json:ro
    # The container user needs the host's docker group to reach the socket.
    # `make up` computes this; override GID in .env if your host differs.
    group_add:
      - ${DOCKER_GID:-999}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8080}:8080"
    networks: [control, sandbox]
    restart: unless-stopped

  admin:
    build:
      context: ./admin
    depends_on: [api]
    ports:
      - "${ADMIN_PORT:-8081}:80"
    networks: [control]
    restart: unless-stopped

  # Optional object storage. Screenshots and session recordings default to a
  # local volume; set ARTIFACT_BACKEND=s3 to use this instead.
  minio:
    image: minio/minio:latest
    profiles: ["s3"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    volumes:
      - minio-data:/data
    ports:
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    networks: [control]

volumes:
  db-data:
  artifacts:
  minio-data:

networks:
  # Platform services. Sandboxes are never attached here.
  control:
    driver: bridge

  # Where sandboxes live. The orchestrator joins it so it can reach agentd and
  # proxy the desktop; nothing else on the control plane can.
  sandbox:
    name: agentfleet_sandbox
    driver: bridge
