name: OpenAgentFleet CI & Release Build Pipeline

on:
  push:
    branches: [ master, main ]
    # Without this a version tag triggered nothing at all, so a release was
    # only ever cut by hand.
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:
    inputs:
      build_binaries:
        description: "Force heavy cross-platform builds (APK, Linux, Windows)"
        required: false
        default: "false"
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 1. Fast Validation Suite (Go Orchestrator, Python Sandbox, React Admin)
  # ---------------------------------------------------------------------------
  fast-validation:
    name: Fast CI (Go, Python, React)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache-dependency-path: backend/go.sum

      - name: Test Go Backend
        run: |
          cd backend
          go test -v ./...

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies & Test Sandbox agentd & Python SDK
        run: |
          cd sandbox/agentd
          pip install -r requirements.txt || true
          python -m unittest discover -p "test_*.py"
          cd ../../sdk/python
          python -m unittest discover -s tests -p "test_*.py"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: admin/package-lock.json

      - name: Build React Admin Console
        run: |
          cd admin
          npm ci
          npm run build
          npm test

      - name: Set up Flutter for Fast Analysis
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Analyze Mobile / Desktop Flutter codebase
        run: |
          cd mobile
          flutter pub get
          flutter analyze

  # ---------------------------------------------------------------------------
  # 2. Heavy Cross-Platform Build: Flutter Android APK
  # (Only runs if repo variable `RUN_HEAVY_BUILDS` is set to 'yes' or triggered manually)
  # ---------------------------------------------------------------------------
  build-flutter-apk:
    name: Build Flutter Android APK
    needs: fast-validation
    if: vars.RUN_HEAVY_BUILDS == 'yes' || inputs.build_binaries == true
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build Android APK
        run: |
          cd mobile
          flutter pub get
          flutter build apk --release --split-per-abi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: agentfleet-companion-apk
          path: mobile/build/app/outputs/flutter-apk/*.apk

  # ---------------------------------------------------------------------------
  # 3. Heavy Cross-Platform Build: Linux Desktop Binary
  # (Only runs if repo variable `RUN_HEAVY_BUILDS` is set to 'yes' or triggered manually)
  # ---------------------------------------------------------------------------
  build-linux-desktop:
    name: Build Linux Desktop Binary
    needs: fast-validation
    if: vars.RUN_HEAVY_BUILDS == 'yes' || inputs.build_binaries == true
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Linux Build Dependencies
        run: |
          sudo apt update
          sudo apt install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build Linux Desktop Bundle
        run: |
          cd mobile
          flutter pub get
          flutter config --enable-linux-desktop
          flutter build linux --release

      - name: Upload Linux Desktop Artifact
        uses: actions/upload-artifact@v7
        with:
          name: agentfleet-linux-desktop
          path: mobile/build/linux/x64/release/bundle/

  # ---------------------------------------------------------------------------
  # 4. Heavy Cross-Platform Build: Windows Desktop EXE
  # (Only runs if repo variable `RUN_HEAVY_BUILDS` is set to 'yes' or triggered manually)
  # ---------------------------------------------------------------------------
  build-windows-exe:
    name: Build Windows Desktop Executable (.exe)
    needs: fast-validation
    if: vars.RUN_HEAVY_BUILDS == 'yes' || inputs.build_binaries == true
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build Windows Executable
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: |
          cd mobile
          flutter pub get
          flutter config --enable-windows-desktop
          flutter build windows --release

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v7
        with:
          name: agentfleet-windows-exe
          path: mobile/build/windows/x64/runner/Release/

  # ---------------------------------------------------------------------------
  # 5. Publish GitHub Release with Binary Bundles
  # ---------------------------------------------------------------------------
  publish-release:
    name: Publish Release Assets
    needs: [build-flutter-apk, build-linux-desktop, build-windows-exe]
    if: always() && (needs.build-flutter-apk.result == 'success' || needs.build-linux-desktop.result == 'success' || needs.build-windows-exe.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download APK Artifact
        uses: actions/download-artifact@v8
        with:
          name: agentfleet-companion-apk
          path: release-assets/apk
        continue-on-error: true

      - name: Download Linux Artifact
        uses: actions/download-artifact@v8
        with:
          name: agentfleet-linux-desktop
          path: release-assets/linux
        continue-on-error: true

      - name: Download Windows Artifact
        uses: actions/download-artifact@v8
        with:
          name: agentfleet-windows-exe
          path: release-assets/windows
        continue-on-error: true

      - name: Package Release Archives
        run: |
          mkdir -p dist
          # Package APK
          if [ -d release-assets/apk ]; then
            cp release-assets/apk/*.apk dist/ || true
          fi
          # Package Linux Tarball
          if [ -d release-assets/linux ]; then
            tar -czvf dist/agentfleet-linux-x64.tar.gz -C release-assets/linux .
          fi
          # Package Windows Zip
          if [ -d release-assets/windows ]; then
            cd release-assets/windows && zip -r ../../dist/agentfleet-windows-x64.zip . && cd ../..
          fi

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Taken from the tag being built. It was hardcoded to v1.0.0, so
          # every later release quietly re-uploaded its assets onto the first
          # one and no new release was ever created.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            echo "not a tag build; nothing to release"
            exit 0
          fi
          TITLE="OpenAgentFleet ${TAG}"

          # Prefer hand-written notes for this version when they exist.
          NOTES="docs/RELEASE_NOTES_${TAG}.md"
          if [ -f "$NOTES" ]; then
            gh release create "$TAG" dist/* --title "$TITLE" --notes-file "$NOTES" \
              || gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "$TITLE" --generate-notes \
              || gh release upload "$TAG" dist/* --clobber
          fi

